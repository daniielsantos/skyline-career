name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-validate:
    name: Build + validate + catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Validate profiles
        run: npm run validate:profiles

      - name: Catalog API smoke
        run: node scripts/ci-catalog.mjs

  catalog-postgres:
    name: Catalog API (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skyline
          POSTGRES_PASSWORD: skyline
          POSTGRES_DB: skyline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skyline -d skyline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://skyline:skyline@localhost:5432/skyline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Migrate
        run: npm run db:migrate

      - name: Seed profiles
        run: npm run db:seed

      - name: Catalog API smoke (Postgres)
        run: node scripts/ci-catalog.mjs
        env:
          DATABASE_URL: postgres://skyline:skyline@localhost:5432/skyline

  smoke-windows:
    name: Agent smoke (Node mock / Named Pipe)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke (Node mock-host)
        # Do not set MSFS_COMPAT_NATIVE — GitHub runners have no MSFS SDK.
        run: npm run smoke
        env:
          MSFS_COMPAT_NATIVE: '0'
