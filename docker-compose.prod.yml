# Prod / VPS overlay — Postgres on loopback only (SSH tunnel / Tailscale).
# World API on loopback only — put Caddy (profile `tls`) or another proxy in front.
# Never publish 0.0.0.0:5432 or Adminer on a VPS.
#
#   npm run career:stack:world -- --prod
#   npm run career:stack:world -- --prod --tls   # + Caddy :80/:443 (needs CAREER_WORLD_HOST)
#
# DB access: SSH tunnel → 127.0.0.1:5432 — docs/agent-context/14-mp-world-clock.md

services:
  postgres:
    ports:
      # Host loopback only — DBeaver/ssh -L 5432:127.0.0.1:5432. Survives recreate.
      - '127.0.0.1:5432:5432'

  world-api:
    ports:
      - '127.0.0.1:8787:8787'
    environment:
      # Existing production worlds must never be silently replaced by a fresh
      # seed if the DB URL/volume is wrong. Set =1 only for first bootstrap.
      CAREER_WORLD_ALLOW_SEED: ${CAREER_WORLD_ALLOW_SEED:-0}

  world-worker:
    # Inherits profile `legacy-worker`; normal prod never starts this service.
    environment:
      CAREER_WORLD_ALLOW_SEED: ${CAREER_WORLD_ALLOW_SEED:-0}

  # Optional TLS terminator (Let's Encrypt). Enable: --profile tls / stack --tls
  caddy:
    image: caddy:2-alpine
    container_name: skyline-career-caddy
    restart: unless-stopped
    profiles: ['tls']
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      # Prefer CAREER_WORLD_HOST; SKYLINE_WORLD_HOST remains a legacy alias.
      CAREER_WORLD_HOST: ${CAREER_WORLD_HOST:-${SKYLINE_WORLD_HOST:?Set CAREER_WORLD_HOST in .env (e.g. world.example.com)}}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - skyline_career_caddy_data:/data
      - skyline_career_caddy_config:/config
    depends_on:
      world-api:
        condition: service_healthy

volumes:
  skyline_career_caddy_data:
  skyline_career_caddy_config:
