# Base stack — safe default: Postgres is NOT published on the host.
# World API / Adminer port bindings come from an overlay:
#   lab:  docker-compose.lab.yml   (local playtest)
#   prod: docker-compose.prod.yml  (VPS — loopback API; DB private)
#
# Examples:
#   npm run db:up                      → postgres + Adminer (lab overlay)
#   npm run career:stack:world         → lab world stack
#   npm run career:stack:world -- --prod
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile world up -d
#
# Remote DB without public :5432 — SSH tunnel or Tailscale (see docs/agent-context/14-mp-world-clock.md).

services:
  postgres:
    image: postgres:16-alpine
    container_name: skyline-career-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skyline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skyline}
      POSTGRES_DB: ${POSTGRES_DB:-skyline}
    # No host ports here — only Docker network. Lab overlay publishes 127.0.0.1:5432.
    volumes:
      - skyline_career_pg_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready alone can pass during crash recovery while SELECT still fails (57P03).
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" && psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c "SELECT 1" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Local “production” world host (no Watch). Ports from lab/prod overlay.
  # Secrets: root `.env` (gitignored) — see `.env.example`.
  world-api:
    image: ${CAREER_WORLD_IMAGE:-ghcr.io/daniielsantos/skyline-career-world:main}
    container_name: skyline-career-world-api
    restart: unless-stopped
    environment:
      CAREER_DATABASE_URL: ${CAREER_DATABASE_URL:-postgres://skyline:skyline@postgres:5432/skyline}
      MAPTILER_KEY: ${MAPTILER_KEY:-}
      CAREER_API_MODE: world
      CAREER_DISABLE_SIM: '1'
      CAREER_AUTH: '1'
      # Registration policy comes from the host .env. Keep lab open by
      # default; production should set CAREER_AUTH_INVITE or disable register.
      CAREER_AUTH_REGISTER: ${CAREER_AUTH_REGISTER:-1}
      CAREER_AUTH_INVITE: ${CAREER_AUTH_INVITE:-}
      # Unsafe/admin-style auth capabilities stay off unless explicitly set.
      CAREER_AUTH_ALLOW_CLAIM: ${CAREER_AUTH_ALLOW_CLAIM:-0}
      CAREER_AUTH_SESSIONS_LIST_ALL: ${CAREER_AUTH_SESSIONS_LIST_ALL:-0}
      CAREER_WORLD_FIXED: '1'
      # Single-writer invariant: this API owns the clock and all economy writes.
      CAREER_HEADLESS_PULSE: '1'
      CAREER_PG: '1'
      CAREER_UI_API_BIND: 0.0.0.0
      CAREER_UI_API_PORT: '8787'
      SKYLINE_CAREER_DATA: /data/career
      SKYLINE_CAREER_CONTENT: /app/profiles/career
    volumes:
      - skyline_career_world_data:/data/career
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:8787/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    profiles: ['world']

  # Emergency/manual compatibility only. Never enable beside the normal
  # world-api: both processes writing the same world creates revision races.
  world-worker:
    image: ${CAREER_WORLD_IMAGE:-ghcr.io/daniielsantos/skyline-career-world:main}
    container_name: skyline-career-world-worker
    restart: unless-stopped
    environment:
      CAREER_DATABASE_URL: ${CAREER_DATABASE_URL:-postgres://skyline:skyline@postgres:5432/skyline}
      CAREER_PG: '1'
    command: ['node', 'scripts/career-world-worker-pg.mjs']
    depends_on:
      postgres:
        condition: service_healthy
      world-api:
        condition: service_healthy
    profiles: ['legacy-worker']

volumes:
  skyline_career_pg_data:
  skyline_career_world_data:
