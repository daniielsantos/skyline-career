# Prod / VPS overlay — Postgres stays Docker-internal (no host :5432 / Adminer).
# World API on loopback only — put Caddy (profile `tls`) or another proxy in front.
#
#   npm run career:stack:world -- --prod
#   npm run career:stack:world -- --prod --tls   # + Caddy :80/:443 (needs CAREER_WORLD_HOST)
#
# DB access: SSH tunnel / Tailscale — docs/agent-context/14-mp-world-clock.md

services:
  world-api:
    ports:
      - '127.0.0.1:8787:8787'

  # Optional TLS terminator (Let's Encrypt). Enable: --profile tls / stack --tls
  caddy:
    image: caddy:2-alpine
    container_name: skyline-career-caddy
    restart: unless-stopped
    profiles: ['tls']
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      # Prefer CAREER_WORLD_HOST; SKYLINE_WORLD_HOST remains a legacy alias.
      CAREER_WORLD_HOST: ${CAREER_WORLD_HOST:-${SKYLINE_WORLD_HOST:?Set CAREER_WORLD_HOST in .env (e.g. world.example.com)}}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - skyline_career_caddy_data:/data
      - skyline_career_caddy_config:/config
    depends_on:
      world-api:
        condition: service_healthy

volumes:
  skyline_career_caddy_data:
  skyline_career_caddy_config:
