# Lab overlay — local PC playtest only.
# Publishes Postgres + Adminer on loopback; world-api on all interfaces (:8787).
#
#   docker compose -f docker-compose.yml -f docker-compose.lab.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.lab.yml --profile world up -d
#
# Do NOT use this file on a public VPS.

services:
  postgres:
    ports:
      - '127.0.0.1:5432:5432'

  adminer:
    image: adminer:4
    container_name: skyline-career-adminer
    restart: unless-stopped
    ports:
      - '127.0.0.1:8081:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  world-api:
    build:
      context: .
      dockerfile: Dockerfile.world
    ports:
      - '8787:8787'

  world-worker:
    # Buildable only for explicit `--profile legacy-worker` diagnostics.
    build:
      context: .
      dockerfile: Dockerfile.world
