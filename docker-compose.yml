services:
  postgres:
    image: postgres:16-alpine
    container_name: skyline-career-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: skyline
      POSTGRES_PASSWORD: skyline
      POSTGRES_DB: skyline
    ports:
      - '5432:5432'
    volumes:
      - skyline_career_pg_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready alone can pass during crash recovery while SELECT still fails (57P03).
      test:
        [
          'CMD-SHELL',
          'pg_isready -U skyline -d skyline && psql -U skyline -d skyline -c "SELECT 1" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Lab DB UI — keep for local sim; do not expose on a real VPS.
  adminer:
    image: adminer:4
    container_name: skyline-career-adminer
    restart: unless-stopped
    ports:
      - '8081:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  # Local “production” world host (no Watch). Start with:
  #   docker compose --profile world up -d --build
  # Desktop: CAREER_WORLD_API_URL=http://127.0.0.1:8787 CAREER_UI_API_PORT=8788
  world-api:
    build:
      context: .
      dockerfile: Dockerfile.world
    container_name: skyline-career-world-api
    restart: unless-stopped
    environment:
      CAREER_DATABASE_URL: postgres://skyline:skyline@postgres:5432/skyline
      CAREER_API_MODE: world
      CAREER_DISABLE_SIM: '1'
      CAREER_AUTH: '1'
      CAREER_WORLD_FIXED: '1'
      CAREER_HEADLESS_PULSE: '0'
      CAREER_PG: '1'
      CAREER_UI_API_BIND: 0.0.0.0
      CAREER_UI_API_PORT: '8787'
      SKYLINE_CAREER_DATA: /data/career
      SKYLINE_CAREER_CONTENT: /app/profiles/career
    ports:
      - '8787:8787'
    volumes:
      - skyline_career_world_data:/data/career
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:8787/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    profiles: ['world']

  world-worker:
    build:
      context: .
      dockerfile: Dockerfile.world
    container_name: skyline-career-world-worker
    restart: unless-stopped
    environment:
      CAREER_DATABASE_URL: postgres://skyline:skyline@postgres:5432/skyline
      CAREER_PG: '1'
    command: ['node', 'scripts/career-world-worker-pg.mjs']
    depends_on:
      postgres:
        condition: service_healthy
      world-api:
        condition: service_healthy
    profiles: ['world']

volumes:
  skyline_career_pg_data:
  skyline_career_world_data:
