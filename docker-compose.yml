services:
  postgres:
    image: postgres:16-alpine
    container_name: skyline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: skyline
      POSTGRES_PASSWORD: skyline
      POSTGRES_DB: skyline
    ports:
      - '5432:5432'
    volumes:
      - skyline_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skyline -d skyline']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  skyline_pg_data:
