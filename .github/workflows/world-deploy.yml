name: World deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        type: choice
        required: true
        options:
          - production
      ref:
        description: Git ref or commit to build
        required: true
        default: main

concurrency:
  group: world-${{ github.event_name == 'release' && 'production' || inputs.target || 'image' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/daniielsantos/skyline-career-world

jobs:
  build:
    name: Build amd64 image
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.result.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}
      revision: ${{ steps.meta.outputs.revision }}
    steps:
      - name: Resolve source revision
        id: source
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >>"$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            echo "ref=${{ github.event.release.tag_name }}" >>"$GITHUB_OUTPUT"
          else
            echo "ref=${{ inputs.ref }}" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 0

      - name: Generate immutable image tags
        id: meta
        shell: bash
        run: |
          revision="$(git rev-parse HEAD)"
          {
            echo "revision=$revision"
            echo "image=$IMAGE_NAME"
            echo "tags<<EOF"
            echo "$IMAGE_NAME:sha-$revision"
            if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
              echo "$IMAGE_NAME:main"
            elif [[ "${{ github.event_name }}" == "release" ]]; then
              echo "$IMAGE_NAME:${{ github.event.release.tag_name }}"
            fi
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push amd64
        id: build
        if: github.event_name != 'release'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.world
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=world-amd64
          cache-to: type=gha,mode=max,scope=world-amd64

      - name: Wait for successful main image build
        if: github.event_name == 'release'
        uses: actions/github-script@v8
        env:
          REVISION: ${{ steps.meta.outputs.revision }}
        with:
          script: |
            const revision = process.env.REVISION;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            for (let attempt = 1; attempt <= 180; attempt += 1) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'world-deploy.yml',
                event: 'workflow_run',
                head_sha: revision,
                per_page: 20,
              });
              // Prefer a successful image build; ignore cancelled/failed siblings
              // from concurrent pushes on the same SHA.
              const success = data.workflow_runs.find(
                (run) =>
                  run.id !== context.runId &&
                  run.status === 'completed' &&
                  run.conclusion === 'success',
              );
              if (success) {
                core.info(`Main image workflow ${success.id} succeeded`);
                return;
              }
              const failed = data.workflow_runs.find(
                (run) =>
                  run.id !== context.runId &&
                  run.status === 'completed' &&
                  run.conclusion &&
                  run.conclusion !== 'success' &&
                  run.conclusion !== 'cancelled' &&
                  run.conclusion !== 'skipped',
              );
              if (failed) {
                core.setFailed(
                  `Main image workflow ${failed.id} completed as ${failed.conclusion}`,
                );
                return;
              }
              if (attempt % 6 === 0) {
                core.info(
                  `Waiting for main image workflow (${attempt * 10}s elapsed)`,
                );
              }
              await sleep(10_000);
            }
            core.setFailed(
              `Main image workflow did not succeed within 30 minutes for ${revision}`,
            );

      - name: Reuse immutable image for release
        id: promote
        if: github.event_name == 'release'
        shell: bash
        env:
          SOURCE_IMAGE: ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.revision }}
          RELEASE_IMAGE: ${{ steps.meta.outputs.image }}:${{ github.event.release.tag_name }}
        run: |
          set -Eeuo pipefail
          found=0
          for attempt in $(seq 1 12); do
            if docker buildx imagetools inspect "$SOURCE_IMAGE" >/dev/null 2>&1; then
              found=1
              break
            fi
            sleep 5
          done
          if [[ "$found" != 1 ]]; then
            echo "::error::Successful workflow did not publish visible image: $SOURCE_IMAGE"
            exit 1
          fi

          digest="$(
            docker buildx imagetools inspect "$SOURCE_IMAGE" |
              awk '$1 == "Digest:" && digest == "" { digest = $2 }
                   END { print digest }'
          )"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve manifest digest for $SOURCE_IMAGE"
            exit 1
          fi

          echo "Promoting $SOURCE_IMAGE@$digest as $RELEASE_IMAGE"
          docker buildx imagetools create \
            --tag "$RELEASE_IMAGE" \
            "$SOURCE_IMAGE@$digest"
          release_digest="$(
            docker buildx imagetools inspect "$RELEASE_IMAGE" |
              awk '$1 == "Digest:" && digest == "" { digest = $2 }
                   END { print digest }'
          )"
          if [[ "$release_digest" != "$digest" ]]; then
            echo "::error::Release tag digest differs from immutable source"
            exit 1
          fi
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Export immutable image result
        id: result
        shell: bash
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          PROMOTED_DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          set -Eeuo pipefail
          digest="${BUILD_DIGEST:-$PROMOTED_DIGEST}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build did not produce a valid image digest"
            exit 1
          fi
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy VPS production
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.DEPLOY_HEALTH_URL }}
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
      IMAGE_REF: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
      REVISION: ${{ needs.build.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.revision }}

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_HEALTH_URL"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Authenticate host to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Backup and deploy immutable image
        shell: bash
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- \
            "$DEPLOY_PATH" "$REVISION" "$IMAGE_REF" "$DEPLOY_HEALTH_URL" 1 <<'REMOTE'
          set -Eeuo pipefail
          deploy_path="$1"
          revision="$2"
          image_ref="$3"
          health_url="$4"
          backup="$5"
          cd "$deploy_path"
          git fetch --no-tags origin "$revision"
          git checkout --detach "$revision"
          args=(--image "$image_ref" --health-url "$health_url")
          if [[ "$backup" == 1 ]]; then args+=(--backup); fi
          bash scripts/deploy-world.sh "${args[@]}"
          REMOTE
